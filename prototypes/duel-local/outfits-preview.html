<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel equipment preview</title><style>body{background:#130f20;color:#f0decc;font:16px monospace;max-width:900px;margin:25px auto;padding:0 20px}h1{color:#ebc779}label{display:inline-grid;gap:6px;margin:5px}select,button{font:inherit;background:#2b2136;color:#f0ddc0;border:1px solid #a18369;padding:9px}iframe{display:block;width:100%;aspect-ratio:16/9;border:2px solid #8e7457;margin-top:16px}small{color:#c4b2c4}</style></head><body><h1>Duel equipment preview</h1><p>Check the hunter and rival appearances and weapon animations. This is a visual preview; no items or saves are changed.</p><div id="choices"></div><button data-outcome="correct">Hunter attacks</button> <button data-outcome="incorrect">Rival attacks</button> <button data-outcome="both">Both attack</button><iframe id="arena" title="Duel combat scene" src="/ide/frontend/public/combat/index.html?embed=1"></iframe><p><small>Weapon styles share animation families; an item-specific model is shown only where one exists.</small></p><script>
const looks=['classic','ivory','spectral','harvest','oracle','patchwork','pilgrim','wayfarer','debugger','merchant-oracle'];const styles=['sword','staff','whip','greatsword','handmagic','scythe','oil','unarmed'];const controls=[['armorLook','Hunter armour',looks],['style','Hunter weapon',styles],['rivalArmorLook','Rival armour',looks],['rivalStyle','Rival weapon',styles]];let ready=false,count=0;const data={simulated:false,region:'duel-colosseum',enemy:'duel-rival',armorLook:'classic',style:'sword',rivalArmorLook:'wayfarer',rivalStyle:'sword'};const frame=document.getElementById('arena');function send(extra={}){Object.assign(data,extra);if(ready)frame.contentWindow.diddyCombatReceive(JSON.stringify(data));}for(const [id,title,options] of controls){const label=document.createElement('label');label.textContent=title;const select=document.createElement('select');for(const option of options){const el=document.createElement('option');el.value=el.textContent=option;select.append(el)}select.value=data[id];select.onchange=()=>send({[id]:select.value});label.append(select);document.getElementById('choices').append(label)}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.source==='diddy-combat'&&e.data?.type==='ready'){ready=true;send()}});document.querySelectorAll('[data-outcome]').forEach(button=>button.onclick=()=>send({turn_id:'review-'+(++count),outcome:button.dataset.outcome}));
</script></body></html>
