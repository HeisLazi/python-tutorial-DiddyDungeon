<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quest Lab</title>
<style>
  :root { --bg: #0b0a14; --ink: #f4ecd8; --dim: #8a83a8; --gold: #ffcc33; --red: #ff4d6d; --green: #39e58c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 ui-monospace, "JetBrains Mono", monospace;
    display: grid;
    place-items: center;
    image-rendering: pixelated;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgb(0 0 0 / 0.22) 0 1px, transparent 1px 3px);
  }
  main { text-align: center; padding: 24px; }
  .flame {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    background:
      linear-gradient(var(--gold), var(--gold)) 24px 8px / 16px 8px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 16px 16px / 32px 16px no-repeat,
      linear-gradient(var(--red), var(--red)) 8px 32px / 48px 16px no-repeat,
      linear-gradient(var(--red), var(--red)) 16px 48px / 32px 8px no-repeat;
    animation: flicker 0.6s steps(2) infinite;
  }
  @keyframes flicker { 50% { transform: translateY(-4px) scaleX(0.9); } }
  h1 { margin: 0; font-size: 28px; letter-spacing: 0.18em; color: var(--gold); text-shadow: 3px 3px 0 #6b2b00; }
  p { margin: 10px 0 0; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
  .bar { width: 240px; height: 16px; margin: 26px auto 0; border: 3px solid var(--ink); padding: 2px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--green); animation: load 2.4s steps(12) infinite; }
  @keyframes load { to { width: 100%; } }
  .error { display: none; max-width: 560px; margin: 22px auto 0; padding: 14px; border: 3px solid var(--red); color: var(--ink); text-align: left; white-space: pre-wrap; font-size: 12px; }
  body.failed .bar, body.failed .blink { display: none; }
  body.failed .error { display: block; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <main>
    <div class="flame" aria-hidden="true"></div>
    <h1>QUEST LAB</h1>
    <p id="status" class="blink">Waking PYR…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <pre class="error" id="error"></pre>
  </main>
  <script>
    // The desktop shell calls these through webview eval while the local
    // backend starts; once it is ready the window navigates to the game.
    window.questlabStatus = (text) => { document.getElementById('status').textContent = text }
    window.questlabFailed = (text) => {
      document.body.classList.add('failed')
      document.getElementById('status').textContent = 'Game over'
      document.getElementById('error').textContent = text
    }
  </script>
</body>
</html>
